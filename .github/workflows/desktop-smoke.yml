name: 桌面界面回归

on:
  pull_request:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-smoke:
    name: 桌面 write/restore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - name: 原生 safeStorage 与 Agent 私有导入
        if: runner.os != 'Linux'
        run: npm run test:agent-migration -w desktop
      - name: 原生 safeStorage 与 Agent 私有导入 (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:agent-migration -w desktop
      - name: 真实桌面隔离数据冒烟
        if: runner.os != 'Linux'
        run: npm run desktop:test
      - name: 真实桌面隔离数据冒烟 (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:test
      - name: 打包与内置 Agent 版本、架构绑定的候选桌面
        run: npm run pack -w desktop -- --publish never
      - name: 安装目录运行、升级旧数据与再次启动
        if: runner.os != 'Linux'
        run: node apps/desktop/scripts/test-packaged.mjs
        env:
          ALUNE_DESKTOP_EXECUTOR: agent
          ALUNE_CANDIDATE_EVIDENCE: ${{ runner.temp }}/candidate-ui
      - name: 安装目录运行、升级旧数据与再次启动 (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node apps/desktop/scripts/test-packaged.mjs
        env:
          ALUNE_DESKTOP_EXECUTOR: agent
          ALUNE_CANDIDATE_EVIDENCE: ${{ runner.temp }}/candidate-ui
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-ui-${{ matrix.os }}
          path: ${{ runner.temp }}/candidate-ui
          if-no-files-found: error

  installer-cycle:
    name: 安装、原版升级与回退 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - run: npm run dist -w desktop -- --publish never
      - if: runner.os != 'Linux'
        run: node apps/desktop/scripts/installer-cycle.mjs
      - if: runner.os == 'Linux'
        run: xvfb-run -a node apps/desktop/scripts/installer-cycle.mjs
