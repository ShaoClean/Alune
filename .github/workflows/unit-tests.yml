name: 单元测试

on:
  push:
    branches: [development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 单元测试
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - name: 架构约束、Git hooks 与发布说明
        run: |
          npm run test:retirement
          npm run test:hooks
          npm run test:release-notes
      - name: 领域契约、协议与客户端
        run: |
          npm test -w @alune/domain
          npm test -w @alune/protocol
          npm test -w @alune/agent-client
      - name: Agent（含 Git 回归与 PTY）
        run: npm test -w @alune/agent
      - name: 桌面端与 Web
        run: |
          npm run desktop:test:unit
          npm test -w web
      - run: npm run ui:check
