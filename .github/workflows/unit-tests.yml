name: 单元测试

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 单元测试 (${{ matrix.workspace }})
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: agent-client
            command: npm test -w @alune/agent-client
          - workspace: agent
            command: npm test -w @alune/agent
          - workspace: domain
            command: npm test -w @alune/domain
          - workspace: protocol
            command: npm test -w @alune/protocol
          - workspace: desktop
            command: npm run desktop:test:unit
          - workspace: ui
            command: npm run ui:check
          - workspace: web
            command: npm test -w web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - name: 构建 Agent、SDK 与领域契约
        run: npx turbo build --filter=@alune/agent
      - run: npm run test:retirement
      - name: 运行单元测试
        run: ${{ matrix.command }}

  local-git:
    name: 本地 Git 与代理 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npx turbo build --filter=@alune/agent
      - name: Agent Git、文件、SSH 与代理行为
        run: node --test --test-concurrency=2 --test-timeout=300000 packages/agent/tests/git-*.test.cjs
