name: 独立 Agent

on:
  pull_request:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: agent-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Agent / Node / SQLite / PTY (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: win32-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: 核对原生目标架构
        run: node -e "if (process.platform + '-' + process.arch !== '${{ matrix.target }}') throw new Error('Runner architecture mismatch')"
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test -w @alune/protocol
      - run: npm test -w @alune/agent-client
      - run: npm test -w @alune/agent
      - run: node scripts/agent/check-browser.mjs
      - run: node scripts/agent/check-boundaries.mjs
      - name: 记录构建后的工作区差异
        run: |
          git status --short
          git diff --summary
          git diff --numstat
      - name: 打包含官方 Node 的独立 Agent
        shell: bash
        run: node scripts/agent/package.mjs --output "$RUNNER_TEMP/alune-agent-${{ matrix.target }}"
      - name: 验证包内协议与生命周期
        shell: bash
        run: node scripts/agent/test-packaged.mjs "$RUNNER_TEMP/alune-agent-${{ matrix.target }}" --require-clean
      - name: 验证独立包经过 SSH 的路由、代理、PTY 和 Worktree 保护
        shell: bash
        run: node scripts/agent/test-ssh-packaged.mjs "$RUNNER_TEMP/alune-agent-${{ matrix.target }}"
      - name: 保存可执行权限并生成归档
        shell: bash
        working-directory: ${{ runner.temp }}
        run: tar -czf "alune-agent-${{ matrix.target }}.tar.gz" "alune-agent-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: alune-agent-${{ matrix.target }}
          path: ${{ runner.temp }}/alune-agent-${{ matrix.target }}.tar.gz
          if-no-files-found: error
