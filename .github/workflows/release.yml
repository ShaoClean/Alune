name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      # Hooks, release-note and desktop unit tests already ran on the PR and on the
      # development push. Only the tag check is release-specific; release.mjs
      # still needs js-yaml, so install packages without lifecycle downloads.
      - run: npm ci --ignore-scripts
      - name: Validate version tag and public update source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          node apps/desktop/scripts/release.mjs tag "$RELEASE_TAG"
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "The GitHub update source must be public before publishing a desktop release."
            exit 1
          fi

  agent-artifacts:
    needs: validate
    uses: ./.github/workflows/agent-tests.yml
    with:
      # The tagged code passed these source tests on all four targets in its PR.
      # Release runs still package and verify the shipped Agent on each target.
      skip_source_tests: true

  installer-cycle:
    needs: validate
    uses: ./.github/workflows/desktop-smoke.yml

  build:
    needs: agent-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: mac-arm64
          - os: macos-15-intel
            arch: x64
            target: mac-x64
          - os: windows-2022
            arch: x64
            target: win-x64
          - os: ubuntu-22.04
            arch: x64
            target: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ALUNE_SMOKE_VISIBLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify native build architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Native runner architecture mismatch')"
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/download-artifact@v4
        with:
          name: verified-agent-catalog
          path: ${{ runner.temp }}/agent-release
      - name: Download the verified SSH Agent archive for the smoke test
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: ssh-deploy-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/ssh-deploy
      - name: Build installers without publishing
        env:
          ALUNE_STAGE_RELEASE_CATALOG: ${{ runner.temp }}/agent-release/agent-catalog.json
        # desktop:build already staged the app and Agent runtime.
        run: npm --ignore-scripts run dist -w desktop -- --publish never
      # The PR already ran the full write/restore suite on Linux and Windows
      # (desktop-smoke.yml). Those targets check the shipped executable with the
      # terminals focus: Agent runtime, Git write and the native PTY. macOS has no
      # PR coverage, so it keeps the full suite here.
      - name: Packaged application smoke test (full suite)
        if: runner.os == 'macOS'
        env:
          ALUNE_TEST_SSH_BUNDLE_DIR: ${{ runner.temp }}/ssh-deploy
        run: node apps/desktop/scripts/test-packaged.mjs
      - name: Packaged application smoke test (terminals focus)
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/test-packaged.mjs --focus terminals
      - name: Packaged application smoke test (terminals focus, Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node apps/desktop/scripts/test-packaged.mjs --focus terminals
      - name: Collect platform release assets
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: node apps/desktop/scripts/release.mjs collect "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          compression-level: 0
          name: desktop-${{ matrix.target }}
          path: apps/desktop/release/upload/*
          if-no-files-found: error

  publish:
    needs: [build, installer-cycle]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify all artifacts and produce SHA256SUMS
        run: node apps/desktop/scripts/release.mjs verify release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: ssh-deploy-*
          path: ${{ runner.temp }}/agent-builds
      - name: Verify and collect standalone Agents and SHA256SUMS
        shell: bash
        run: node scripts/agent/release-assets.mjs collect "$RUNNER_TEMP/agent-builds" release-assets
      - name: Generate categorized release notes from published release history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:notes:github -- "$RELEASE_TAG" release-notes.md
      - name: Upload complete draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e "if (!require('./release-state.json').isDraft) throw new Error('Refusing to overwrite a published release')"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

  refresh-release-issue:
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: 刷新公开更新日志
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-issue.yml --ref development
